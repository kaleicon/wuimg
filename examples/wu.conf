# Example wu.conf with default values

## Window settings
# Auto-magnify images whose smaller dimension is under this size.
magnify_under = 128

# Window size hint on startup.
initial_size = 640 480

# Background color in RGBA order. Values are in range 0-255 or 0x00-0xff.
# The fourth field controls window transparency, but depending on the display
# backend and window manager, you may get an opaque window anyway.
# Default color is dark gray:
bg = 0x33 0x33 0x33 0xff
# Half transparent gray:
#bg = 0x33 0x33 0x33 0x7f

# Background color source. One of:
# - "default": Use only the configured color.
# - "metadata": If the current image has a background metadata field,
#    use its RGB values.
bg_src = default

# When to stretch images with a non-square pixel ratio:
# - "always": Always stretch the image.
# - "pretty": Ignore ratio when it would cause unsightly artifacts
#   (a non-integer ratio).
# - "never": Never stretch the image.
heed_pixel_ratio = always

# Request no decorations or widgets around the window.
no_window_decorations = false

# If "true", render window contents as sRGB. This is the default behaviour,
# but if set to "false" under Wayland, and the compositor supports the
# color-management protocol, we'll try to render to the preferred display
# colorspace.
# This is experimental, and chances are that something will look wrong.
naive_window_colorspace = true

# On Wayland, when standard cursor shapes are not supported by the compositor,
# a simple cursor is drawn using code. This cursor is honestly kind of ugly,
# but it has to be tested somehow, so this setting forces its use.
# Size is controlled by the XCURSOR_SIZE env variable.
custom_cursor = false


## JPEG
# Use a faster but less exact DCT algorithm for decoding. According to libjpeg,
# there's no perceptible difference for images with a quality level below 85
# (encoded by libjpeg, we assume), but above that it becomes more pronounced,
# and if possible this should be avoided for levels above 97.
# This setting applies to all images, as there's no simple method to determine
# the quality level of a file.
jpeg_fast_dct = false


## JPEG2000
# Limit the number of decoded quality layers to this amount, or unlimited if 0.
# Depending on the file, this will reduce quality in exchange of faster
# decoding.
jpeg2000_quality_layers = 0


## RAW camera formats
# Render with 16 bits per component instead of 8. Increases memory and decoding
# time.
raw_16bit = false

# Render at half the original size. Reduces memory and decoding time.
raw_half_size = false

# If "true", display the file's embedded thumbnail instead if it's close to the
# size of the original, otherwise do a full and slow render of the raw data.
# The thumbnail might have camera effects applied (like sepia or grayscale) and
# thus look very different from a straight render.
raw_prefer_thumbnail = false


# SVG
# If "true", treat the window like a canvas and render based on user
# interaction. This makes the image truly scalable and allows exploring objects
# outside the viewbox, but interaction can become laggy for big windows or
# complex scenes.
# If "false", the image is rasterized just once at its native size, which could
# be huge.
svg_window_adapt = true


# TIFF
# If "true", and if the image fits certain criteria, use our own pixel
# unpacking routines instead of libtiff's high-level interface. This usually
# results in lower memory usage, faster decoding and display, and support for
# some exotic bitdepths. The catch is that TIFF supports a huge amount of
# storage options, so some unusual file out there might display wrong.
tiff_use_homegrown_unpacker = true


# WEBP
# For lossy WebP, skip the filtering stage. Trades quality for speed.
webp_bypass_filtering = false

# For lossy animated WebP, use a faster chroma upsampler. Static images are
# upsampled in the GPU so they're not affected.
webp_fast_upsamp = false

# Composite animation frames using our own routines instead of libwebp's.
# These work slightly slower, but since we get extent information, it lets us
# send partial updates to the GPU, which may or may not make up for it.
webp_use_homegrown_renderer = false
